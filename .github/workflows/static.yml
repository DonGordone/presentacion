<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SENTINEL – Presentación (Web Slides)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#020617;
      --overlay:rgba(15,23,42,.62);
      --panel:rgba(2,6,23,.62);
      --stroke:rgba(148,163,184,.18);
      --pad:16px;

      --safeTop: env(safe-area-inset-top);
      --safeRight: env(safe-area-inset-right);
      --safeBottom: env(safe-area-inset-bottom);
      --safeLeft: env(safe-area-inset-left);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:0;
      background:var(--bg);
      color:#fff;
      font-family:'Open Sans',sans-serif;
      overflow:auto;
      -webkit-text-size-adjust:100%;
    }
    .brand-font{ font-family:'Montserrat',sans-serif; }

    .stage{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding: calc(var(--pad) + var(--safeTop)) calc(var(--pad) + var(--safeRight))
               calc(var(--pad) + var(--safeBottom)) calc(var(--pad) + var(--safeLeft));
      background:var(--bg);
    }

    /* Default: Desktop/Tablet keeps 16:9 */
    .slide-container{
      position:relative;
      width:min(1280px,100%);
      aspect-ratio:16/9;
      max-height: calc(100dvh - (var(--pad)*2) - var(--safeTop) - var(--safeBottom));
      overflow:hidden;
      background:#0f172a;
      display:flex;
      flex-direction:column;
      border-radius:20px;
      box-shadow:0 20px 80px rgba(0,0,0,.55);
      outline:1px solid rgba(148,163,184,.12);
    }

    /* ✅ Mobile: use the available height instead of forcing 16:9
       This prevents "looks wrong unless fullscreen" issues */
    @media (max-width: 520px){
      .stage{
        padding: calc(10px + var(--safeTop)) calc(10px + var(--safeRight))
                 calc(10px + var(--safeBottom)) calc(10px + var(--safeLeft));
      }
      .slide-container{
        width: 100%;
        height: calc(100dvh - 20px - var(--safeTop) - var(--safeBottom));
        max-height: none;
        aspect-ratio: auto;   /* <- critical */
        border-radius: 16px;
      }
    }

    .overlay{ position:absolute; inset:0; background:var(--overlay); z-index:10; }
    .vignette{ position:absolute; inset:0; z-index:10; box-shadow:inset 0 0 220px rgba(0,0,0,.92); pointer-events:none; }

    .tech-rail{
      position:absolute; right:0; top:50%; transform:translateY(-50%);
      width:6px; height:40%;
      background:rgba(148,163,184,.18);
      border-radius:999px 0 0 999px;
      z-index:30;
    }
    @media (max-width:520px){ .tech-rail{ display:none; } }

    .content{
      position:relative;
      z-index:20;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding: clamp(14px, 4vw, 64px);
    }

    /* Scalable typography */
    .t-title{ font-size:clamp(36px,8vw,96px); line-height:.95; letter-spacing:-.03em; }
    .t-h2{ font-size:clamp(24px,5.5vw,72px); line-height:1.03; letter-spacing:-.02em; }
    .t-h3{ font-size:clamp(16px,2.5vw,30px); line-height:1.2; }
    .t-sub{ font-size:clamp(14px,2.2vw,28px); line-height:1.35; }
    .t-body{ font-size:clamp(12px,1.8vw,20px); line-height:1.45; }
    .t-small{ font-size:clamp(10px,1.1vw,12px); }

    /* Nav */
    .navBar{
      position:absolute;
      left: calc(12px + var(--safeLeft));
      right: calc(12px + var(--safeRight));
      bottom: calc(12px + var(--safeBottom));
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      pointer-events:none;
    }

    .btn{
      pointer-events:auto;
      border-radius:999px;
      padding:12px 14px;
      background:var(--panel);
      outline:1px solid var(--stroke);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      transition:transform 120ms ease, background 120ms ease, opacity 120ms ease;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
      font-size:14px;
    }
    .btn:hover{ transform:translateY(-1px); background:rgba(2,6,23,.78); }
    .btn:active{ transform:translateY(0); }
    .btn[disabled]{ opacity:.4; cursor:not-allowed; }

    .pill{
      pointer-events:auto;
      border-radius:999px;
      padding:10px 12px;
      background:rgba(2,6,23,.45);
      outline:1px solid rgba(148,163,184,.14);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      font-size:11px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:rgba(226,232,240,.85);
      text-align:center;
      flex:0;
    }

    @media (max-width:520px){
      .btn .label{ display:none; } /* icon-only on mobile */
    }

    .card{
      background: rgba(2,6,23,.45);
      outline: 1px solid rgba(148,163,184,.14);
      border-radius: 16px;
      padding: clamp(12px, 2.2vw, 20px);
    }
  </style>
</head>

<body>
