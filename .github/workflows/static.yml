    let idx = 0;
    const root = document.getElementById("slideRoot");
    const bgImg = document.getElementById("bgImg");
    const content = document.getElementById("content");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const counterPill = document.getElementById("counterPill");

    function paint(){
      const s = slides[idx];
      bgImg.src = s.bg || "";
      bgImg.alt = s.title || "Slide";
      content.innerHTML = s.render();
      counterPill.textContent = `${idx + 1} / ${slides.length}`;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === slides.length - 1;
    }

    function next(){ if(idx < slides.length - 1){ idx++; paint(); } }
    function prev(){ if(idx > 0){ idx--; paint(); } }

    prevBtn.addEventListener("click", prev);
    nextBtn.addEventListener("click", next);

    // Keyboard navigation (desktop)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
      if (e.key === " " || e.key === "Enter") next();
    });

    // Swipe navigation (mobile)
    let startX = 0, startY = 0, moved = false;
    root.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; moved = false;
    }, { passive: true });

    root.addEventListener("touchmove", () => { moved = true; }, { passive: true });

    root.addEventListener("touchend", (e) => {
      if (!moved) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dy) < 50) {
        if (dx < 0) next();
        else prev();
      }
    }, { passive: true });

    paint();
  </script>
